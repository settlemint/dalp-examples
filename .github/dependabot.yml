version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["oxlint", "oxfmt", "turbo", "typescript", "vite"]
